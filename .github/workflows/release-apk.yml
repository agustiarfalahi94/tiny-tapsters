# Builds the signed release APK and attaches it to the GitHub Release.
#
# Triggered by:
#   - pushing a v* tag  -> build + attach APK to the release for that tag
#   - workflow_dispatch -> manual test build (no release is created)
#
# Secrets required (set in repo settings > Secrets and variables > Actions):
#   POLLIE_ENDPOINT - repo *variable* (not a secret): the Cloudflare Worker
#                     URL that holds Pollie's Gemini key. See worker/README.md.
#                     A URL in an APK is not a secret; the key it stands in
#                     front of was, which is why it no longer ships.
#   KEYSTORE_BASE64 - base64 of android/app/release-keystore.jks
#   STORE_PASSWORD  - keystore password (from android/key.properties)
#   KEY_PASSWORD    - key password (from android/key.properties)
#   KEY_ALIAS       - key alias (from android/key.properties)
name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'

      - name: Verify code
        run: |
          flutter pub get
          flutter analyze
          dart format --set-exit-if-changed lib/ test/
          flutter test

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release-keystore.jks\n' \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

      - name: Build release APK
        env:
          POLLIE_ENDPOINT: ${{ vars.POLLIE_ENDPOINT }}
        run: flutter build apk --release --dart-define=POLLIE_ENDPOINT=$POLLIE_ENDPOINT

      - name: Name the APK
        # Slashes in GITHUB_REF_NAME make the destination a directory that does
        # not exist, so a manual run from any `chore/x` branch failed before it
        # reached the steps worth testing. Tags have no slash, so a release
        # asset is still named exactly tiny-tapsters-vX.Y.Z.apk.
        run: |
          name="${GITHUB_REF_NAME//\//-}"
          cp build/app/outputs/flutter-apk/app-release.apk \
             "build/app/outputs/flutter-apk/tiny-tapsters-${name}.apk"

      - name: Upload APK artifact
        # v4 targets Node.js 20, which GitHub deprecated and now force-runs on
        # Node 24; a runner update would eventually stop releases building.
        uses: actions/upload-artifact@v7
        with:
          name: tiny-tapsters-apk
          path: build/app/outputs/flutter-apk/tiny-tapsters-*.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: build/app/outputs/flutter-apk/tiny-tapsters-*.apk
