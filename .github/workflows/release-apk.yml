# Builds the signed release APK and attaches it to the GitHub Release.
#
# Triggered by:
#   - pushing a v* tag  -> build + attach APK to the release for that tag
#   - workflow_dispatch -> manual test build (no release is created)
#
# Secrets required (set in repo settings > Secrets and variables > Actions):
#   GEMINI_API_KEY  - Pollie's Gemini key (never commit it!)
#   KEYSTORE_BASE64 - base64 of android/app/release-keystore.jks
#   STORE_PASSWORD  - keystore password (from android/key.properties)
#   KEY_PASSWORD    - key password (from android/key.properties)
#   KEY_ALIAS       - key alias (from android/key.properties)
name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'

      - name: Verify code
        run: |
          flutter pub get
          flutter analyze
          dart format --set-exit-if-changed lib/ test/
          flutter test

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release-keystore.jks\n' \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

      - name: Build release APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: flutter build apk --release --dart-define=GEMINI_API_KEY=$GEMINI_API_KEY

      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/our-toddlers-journey-${GITHUB_REF_NAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: our-toddlers-journey-apk
          path: build/app/outputs/flutter-apk/our-toddlers-journey-*.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/our-toddlers-journey-*.apk
