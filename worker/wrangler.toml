name = "pollie"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# The Gemini key is NEVER written here — this file is committed.
# Set it with:  npx wrangler secret put GEMINI_API_KEY
# Check it with: npx wrangler secret list

# One user must not be able to drain the free-tier quota everyone shares.
# 30 requests a minute is far more than a child talking, and far less than a
# script.
[[unsafe.bindings]]
name = "POLLIE_RATE_LIMIT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }
